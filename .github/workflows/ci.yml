# Comprueba cada push y cada PR: tests de Spring y Django, y que la web compile.
# Ninguno necesita PostgreSQL ni claves de IA (Django usa SQLite y proveedores simulados).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spring:
    name: Spring Boot (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring-boot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test

  django:
    name: Django (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-django
    env:
      DB_ENGINE: sqlite3
      DJANGO_SECRET_KEY: ci-no-es-secreta
      IA_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-django/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test ia_engine catalog

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npm run build
